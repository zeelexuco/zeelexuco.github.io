<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEE LEXU.CO</title><script src="https://js.paystack.co/v1/inline.js"></script>
<style>:root{--gold:#d4af37}*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff}.header{display:flex;justify-content:space-between;padding:14px 5%;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:99}.logo{font-weight:900;font-size:20px}.logo span{color:var(--gold)}.btn{padding:9px 16px;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:24px;cursor:pointer;font-size:13px}.btn-gold{background:var(--gold);color:#000;font-weight:700}.btn-whatsapp{background:#25D366;color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer}.btn-paystack{background:#0AA2FF;color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:14px}input,textarea,select{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin:7px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:200;padding:12px}.modal.active{display:flex}.box{background:#151515;border:1px solid #333;border-radius:20px;padding:22px;width:100%;max-width:460px;position:relative;max-height:92vh;overflow:auto}.close{position:absolute;right:18px;top:12px;font-size:24px;cursor:pointer}.admin-panel{display:none;padding:20px 5%}.admin-panel.active{display:block}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:15px 5%}.user-bar{padding:10px 5%;background:#111;border-bottom:1px solid #222;display:none;justify-content:space-between;align-items:center}.user-bar.active{display:flex}.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:#666;font-size:12px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:#333}</style></head><body>
<div class="header"><div class="logo">ZEE <span>LEXU.CO</span></div><div style="display:flex;gap:8px"><button class="btn" onclick="openModal('loginModal')">Login</button><button class="btn btn-gold" onclick="openModal('adminModal')">Admin</button></div></div>
<div id="userBar" class="user-bar"><span id="userInfo"></span><div style="display:flex;gap:8px"><button class="btn btn-gold" onclick="openModal('sellModal')" style="padding:6px 12px">+ Sell</button><button class="btn" onclick="logout()" style="padding:6px 12px">Logout</button></div></div>
<div style="text-align:center;padding:30px 5% 10px"><h1 style="font-size:30px">ZEE <span style="color:var(--gold)">LEXU.CO</span></h1><p style="color:#999;font-size:13px">Marketplace - WhatsApp & Paystack</p><p style="color:#25D366;font-size:11px">Orders → 07013287677</p></div>
<div id="products" class="product-grid"></div>
<div id="loginModal" class="modal"><div class="box"><span class="close" onclick="closeModal('loginModal')">&times;</span><h2 style="color:var(--gold)">Welcome</h2><button class="btn" style="background:#fff;color:#000;width:100%;padding:12px;border-radius:10px;margin-top:10px" onclick="googleLogin()">Continue with Google</button><div class="divider">OR EMAIL</div><input id="custEmail" type="email" placeholder="Email"><input id="custPass" type="password" placeholder="Password"><p id="custError" style="color:#ff5555;display:none"></p><button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="customerLogin()">Login</button></div></div>
<div id="signupModal" class="modal"><div class="box"><span class="close" onclick="closeModal('signupModal')">&times;</span><h2 style="color:var(--gold)">Create Account</h2><button class="btn" style="background:#fff;color:#000;width:100%;padding:12px;border-radius:10px;margin-top:10px" onclick="googleLogin()">Sign up with Google</button><div class="divider">OR EMAIL</div><input id="signEmail" type="email" placeholder="Email"><input id="signPass" type="password" placeholder="Password min 6"><input id="signName" placeholder="Store Name"><p id="signError" style="color:#ff5555;display:none"></p><button class="btn btn-gold" style="width:100%" onclick="customerSignup()">Create</button></div></div>
<div id="sellModal" class="modal"><div class="box"><span class="close" onclick="closeModal('sellModal')">&times;</span><h2 style="color:var(--gold)">Sell Product</h2><input id="sName" placeholder="Product Name"><input id="sPrice" type="number" placeholder="Price ₦"><input id="sImg" placeholder="Image URL"><select id="sCat"><option>CHAINS</option><option>RINGS</option><option>BRACELETS</option><option>WATCHES</option></select><button class="btn btn-gold" style="width:100%;margin-top:10px" onclick="customerAddProduct()">List</button></div></div>
<div id="checkoutModal" class="modal"><div class="box" style="border:1px solid var(--gold)"><span class="close" onclick="closeModal('checkoutModal')">&times;</span><h2 style="color:var(--gold)">Checkout</h2><div id="checkoutInfo" style="margin:10px 0;background:#1e1e1e;padding:12px;border-radius:12px"></div><input id="cName" placeholder="Your Full Name"><input id="cPhone" placeholder="Your Phone"><input id="cAddress" placeholder="Delivery Address"><input id="cQty" type="number" value="1" min="1"><p style="font-size:12px;color:#888;margin-top:6px">Total: <span id="cTotal" style="color:var(--gold);font-weight:700"></span></p><button class="btn-paystack" onclick="payWithPaystack()">Pay with Paystack</button><button class="btn-whatsapp" onclick="orderWhatsApp()">Order via WhatsApp</button></div></div>
<div id="adminModal" class="modal"><div class="box" style="border:1px solid var(--gold)"><span class="close" onclick="closeModal('adminModal')">&times;</span><h2 style="color:var(--gold)">ADMIN</h2><button class="btn" style="background:#fff;color:#000;width:100%;padding:12px;border-radius:10px;margin-top:10px" onclick="googleAdminLogin()">Login with Google</button><div class="divider">OR EMAIL</div><input id="adminEmail" type="email" value="admin@zeelexuco.com"><input id="adminPass" type="password" placeholder="Admin Password"><p id="adminError" style="color:#ff5555;display:none"></p><button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="adminLogin()">Enter</button></div></div>
<div id="adminPanel" class="admin-panel"><h2 style="color:var(--gold)">OWNER DASHBOARD</h2><p id="adminWelcome" style="color:#888;font-size:12px"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px"><div class="card"><h4>Payments</h4><p style="font-size:11px;color:#25D366">WhatsApp: 2347013287677 ✅</p><input id="setPaystackKey" placeholder="Paystack Public Key pk_..."><button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="saveSettings()">Save Key</button></div><div class="card"><h4>Admin</h4><input id="newAdminEmail" placeholder="Admin Gmail"><input id="newAdminPass" type="password" placeholder="New Password"><button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="updateAdminCreds()">Update</button><button class="btn" style="width:100%;margin-top:10px" onclick="adminLogout()">Logout</button></div></div><div id="adminProducts" style="margin-top:15px"></div></div>
<script>
let ADMIN_CREDS=JSON.parse(localStorage.getItem('zee_admin_creds'))||{email:'admin@zeelexuco.com',pass:'Admin@123'};let SETTINGS=JSON.parse(localStorage.getItem('zee_settings'))||{whatsapp:'2347013287677',paystackKey:'pk_test_xxxxxxxx'};let users=JSON.parse(localStorage.getItem('zee_users'))||[];let products=JSON.parse(localStorage.getItem('zee_products_v3'))||[{name:'Gold Chain',price:25000,img:'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400',cat:'CHAINS',owner:'admin@zeelexuco.com'}];let currentUser=JSON.parse(localStorage.getItem('zee_current'))||null;let currentCheckout=null;
function save(){localStorage.setItem('zee_products_v3',JSON.stringify(products));localStorage.setItem('zee_users',JSON.stringify(users));localStorage.setItem('zee_admin_creds',JSON.stringify(ADMIN_CREDS));localStorage.setItem('zee_current',JSON.stringify(currentUser));localStorage.setItem('zee_settings',JSON.stringify(SETTINGS));}
function openModal(id){document.getElementById(id).classList.add('active')}function closeModal(id){document.getElementById(id).classList.remove('active')}function switchToSignup(){closeModal('loginModal');openModal('signupModal')}function switchToLogin(){closeModal('signupModal');openModal('loginModal')}
function updateUI(){if(currentUser){document.getElementById('userBar').classList.add('active');document.getElementById('userInfo').textContent='Hi, '+(currentUser.name||currentUser.email)+' ✅';}else{document.getElementById('userBar').classList.remove('active');}renderProducts();}
function renderProducts(){let h='';products.forEach((p,i)=>{h+=`<div class="card"><img src="${p.img}" style="width:100%;height:130px;object-fit:cover;border-radius:10px"><h4 style="margin:6px 0 2px">${p.name}</h4><p style="color:#d4af37">₦${Number(p.price).toLocaleString()}</p><p style="font-size:10px;color:#888">Seller: ${p.owner}</p><button class="btn btn-gold" style="width:100%;margin-top:8px;padding:6px" onclick="openCheckout(${i})">Buy Now</button>${currentUser&&p.owner===currentUser.email?`<button onclick="delProd(${i})" style="margin-top:6px;background:#331111;color:#ff7777;border:none;padding:4px 8px;border-radius:6px;width:100%;font-size:11px">Delete</button>`:''}</div>`});document.getElementById('products').innerHTML=h;let ah=`<h4>All Listings (${products.length})</h4>`;products.forEach((p,i)=>{ah+=`<div class="card" style="margin:6px 0;display:flex;justify-content:space-between"><div><p style="font-size:13px">${p.name} - ₦${p.price}</p><p style="font-size:10px;color:#888">${p.owner}</p></div><button onclick="delProd(${i})" style="color:red;background:none;border:1px solid #552222;padding:4px 8px;border-radius:6px">Delete</button></div>`});document.getElementById('adminProducts').innerHTML=ah;document.getElementById('setPaystackKey').value=SETTINGS.paystackKey;}
updateUI();
function customerSignup(){let e=document.getElementById('signEmail').value.trim().toLowerCase();let p=document.getElementById('signPass').value;let n=document.getElementById('signName').value.trim();let err=document.getElementById('signError');if(!e||p.length<6){err.style.display='block';err.textContent='Email & pass min 6';return}if(users.find(u=>u.email===e)){err.style.display='block';err.textContent='Exists';return}users.push({email:e,pass:p,name:n||e.split('@')[0]});save();currentUser={email:e,name:n||e.split('@')[0]};save();closeModal('signupModal');updateUI();}
function customerLogin(){let e=document.getElementById('custEmail').value.trim().toLowerCase();let p=document.getElementById('custPass').value;let err=document.getElementById('custError');let u=users.find(x=>x.email===e&&x.pass===p);if(!u){err.style.display='block';err.textContent='Wrong details';return}currentUser={email:u.email,name:u.name};save();closeModal('loginModal');updateUI();}
function logout(){currentUser=null;save();updateUI();}
function googleLogin(){let email=prompt('Enter Gmail:');if(!email||!email.includes('@'))return;let name=email.split('@')[0];if(!users.find(u=>u.email===email.toLowerCase())){users.push({email:email.toLowerCase(),pass:'google_'+Date.now(),name:name});}currentUser={email:email.toLowerCase(),name:name};save();closeModal('loginModal');closeModal('signupModal');updateUI();}
function googleAdminLogin(){let email=prompt('Owner Gmail must match '+ADMIN_CREDS.email);if(!email)return;if(email.toLowerCase()!==ADMIN_CREDS.email.toLowerCase()){alert('DENIED');return}currentUser={email:email.toLowerCase(),name:'Owner'};save();closeModal('adminModal');document.getElementById('adminPanel').classList.add('active');document.getElementById('adminWelcome').textContent='Google Owner: '+email;renderProducts();}
function customerAddProduct(){if(!currentUser){openModal('loginModal');return}let n=document.getElementById('sName').value.trim();let pr=document.getElementById('sPrice').value;let im=document.getElementById('sImg').value.trim();let cat=document.getElementById('sCat').value;if(!n||!pr){alert('Name & price');return}products.unshift({name:n,price:parseInt(pr),img:im||'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=600',cat:cat,owner:currentUser.email});save();closeModal('sellModal');renderProducts();}
function delProd(i){let p=products[i];if(currentUser&&p.owner!==currentUser.email&&currentUser.email!==ADMIN_CREDS.email.toLowerCase()){alert('Only owner');return}if(!confirm('Delete '+p.name+'?'))return;products.splice(i,1);save();renderProducts();}
function adminLogin(){let e=document.getElementById('adminEmail').value.trim().toLowerCase();let p=document.getElementById('adminPass').value;let err=document.getElementById('adminError');if(e!==ADMIN_CREDS.email.toLowerCase()||p!==ADMIN_CREDS.pass){err.style.display='block';err.textContent='ACCESS DENIED';return}currentUser={email:e,name:'Owner'};save();closeModal('adminModal');document.getElementById('adminPanel').classList.add('active');document.getElementById('adminWelcome').textContent='Owner: '+e;document.getElementById('newAdminEmail').value=ADMIN_CREDS.email;renderProducts();}
function updateAdminCreds(){let ne=document.getElementById('newAdminEmail').value.trim().toLowerCase();let np=document.getElementById('newAdminPass').value;if(!ne||np.length<6){alert('Email & pass min 6');return}ADMIN_CREDS={email:ne,pass:np};save();alert('Updated to '+ne);}
function adminLogout(){document.getElementById('adminPanel').classList.remove('active');}
function saveSettings(){let pk=document.getElementById('setPaystackKey').value.trim();SETTINGS.whatsapp='2347013287677';SETTINGS.paystackKey=pk;save();alert('Paystack saved! WhatsApp is 2347013287677');}
function openCheckout(i){if(!currentUser){openModal('loginModal');return}currentCheckout=products[i];let total=currentCheckout.price;document.getElementById('checkoutInfo').innerHTML=`<p style="font-weight:700">${currentCheckout.name}</p><p style="color:#d4af37">₦${Number(total).toLocaleString()}</p><p style="font-size:11px;color:#888">Seller: ${currentCheckout.owner}</p>`;document.getElementById('cTotal').textContent='₦'+Number(total).toLocaleString();document.getElementById('cQty').value=1;openModal('checkoutModal');document.getElementById('cQty').oninput=function(){let q=parseInt(this.value)||1;document.getElementById('cTotal').textContent='₦'+(currentCheckout.price*q).toLocaleString();};}
function getCheckoutData(){let name=document.getElementById('cName').value.trim();let phone=document.getElementById('cPhone').value.trim();let addr=document.getElementById('cAddress').value.trim();let qty=parseInt(document.getElementById('cQty').value)||1;if(!name||!phone||!addr){alert('Fill name, phone, address');return null}return {name,phone,addr,qty,total:currentCheckout.price*qty};}
function orderWhatsApp(){let d=getCheckoutData();if(!d)return;let msg=`Hello ZEE LEXU.CO,%0A%0AI want to order:%0A*Product:* ${currentCheckout.name}%0A*Price:* ₦${currentCheckout.price}%0A*Qty:* ${d.qty}%0A*Total:* ₦${d.total}%0A%0A*My Details:*%0AName: ${d.name}%0APhone: ${d.phone}%0AAddress: ${d.addr}%0ASeller: ${currentCheckout.owner}%0A`;let wa='2347013287677';window.open(`https://wa.me/${wa}?text=${msg}`,'_blank');}
function payWithPaystack(){let d=getCheckoutData();if(!d)return;let key=SETTINGS.paystackKey;if(!key||!key.startsWith('pk_')){alert('Set Paystack Public Key in Admin Dashboard first!');return}let handler=PaystackPop.setup({key:key,email:currentUser.email||'customer@zeelexuco.com',amount:d.total*100,currency:'NGN',ref:''+Math.floor((Math.random()*1000000000)+1),callback:function(response){alert('Payment Success! Ref: '+response.reference);orderWhatsApp();closeModal('checkoutModal');},onClose:function(){alert('Closed');}});handler.openIframe();}
</script></body></html>
