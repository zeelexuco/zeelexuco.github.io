<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEE LEXU.CO - Marketplace</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;border-bottom:1px solid #222;position:sticky;top:0}.logo{font-weight:bold;color:#fde047}.btn{padding:8px 14px;background:#fde047;color:#000;border:none;border-radius:20px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #222}.card img{width:100%;height:150px;object-fit:cover}.info{padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99}.modal.show{display:flex}.box{background:#111;padding:20px;border-radius:16px;width:90%;max-width:350px;border:1px solid #333} input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box}.tab{display:inline-block;padding:6px 10px;background:#222;border-radius:8px;margin-right:5px;cursor:pointer}.tab.active{background:#fde047;color:#000}</style></head><body>
<header><div class="logo">ZEE LEXU.CO</div><div><span id="cartBtn" style="display:none;margin-right:10px;cursor:pointer" onclick="viewCart()">🛒 <span id="cartCount">0</span></span><button class="btn" id="loginBtn" onclick="openLogin()">Login</button><button class="btn" id="logoutBtn" style="display:none;background:#333;color:#fff" onclick="logout()">Logout</button></div></header>
<div style="text-align:center;padding:10px"><h2 style="color:#fde047;margin:5px">ZEE LEXU.CO</h2><div style="font-size:13px;color:#aaa">Marketplace - WhatsApp & Paystack<br>07013287677</div></div>
<div style="background:#fde047;color:#000;text-align:center;padding:6px;font-size:12px">FREE DELIVERY IN LAGOS - Orders above ₦50,000 | WhatsApp: 07013287677</div>
<div class="grid" id="products"></div>

<div class="modal" id="loginModal"><div class="box"><div style="display:flex;justify-content:space-between"><h3>Welcome Back</h3><span onclick="closeLogin()" style="cursor:pointer">X</span></div><div><span class="tab active" onclick="switchTab('email')" id="tEmail">Email</span><span class="tab" onclick="switchTab('phone')" id="tPhone">Phone</span><span class="tab" onclick="switchTab('google')" id="tGoogle">Google</span></div><div id="emailForm"><input id="lEmail" placeholder="Email"><input id="lPass" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:10px" onclick="doLogin()">Continue</button><p style="font-size:12px">No account? <span style="color:#fde047;cursor:pointer" onclick="showCreate()">Create account</span></p></div><div id="createForm" style="display:none"><input id="cEmail" placeholder="Email"><input id="cPass" type="password" placeholder="Password (6+ chars)"><button class="btn" style="width:100%;margin-top:10px" onclick="doCreate()">Create Account</button><p style="font-size:12px">Have account? <span style="color:#fde047;cursor:pointer" onclick="showLogin()">Login</span></p></div><p id="msg" style="font-size:12px;color:#fde047"></p></div></div>

<script>
let users=JSON.parse(localStorage.getItem('zl_users')||'[]');
let prods=JSON.parse(localStorage.getItem('zl_v6_products')||'[{"id":1,"name":"Gold Chain","price":25000,"img":"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400"}]');
let cart=JSON.parse(localStorage.getItem('zl_cart')||'[]');
let currentUser=localStorage.getItem('zl_current_user')||null;

function render(){document.getElementById('products').innerHTML=prods.map(p=>`<div class=card><img src="${p.img}"><div class=info><b>${p.name}</b><br><span style="color:#fde047">₦${p.price.toLocaleString()}</span><br><small style="color:#888">Seller: admin@zeelexuco.com</small><br><button class=btn style="width:100%;margin-top:8px" onclick="buy(${p.id})">Buy Now</button></div></div>`).join('');updateUI()}
function updateUI(){document.getElementById('cartCount').innerText=cart.length;if(currentUser){document.getElementById('loginBtn').style.display='none';document.getElementById('logoutBtn').style.display='inline-block';document.getElementById('cartBtn').style.display='inline-block';document.getElementById('logoutBtn').innerText='Hi, '+currentUser.split('@')[0]}else{document.getElementById('loginBtn').style.display='inline-block';document.getElementById('logoutBtn').style.display='none';document.getElementById('cartBtn').style.display='none'}}
function buy(id){if(!currentUser){openLogin();document.getElementById('msg').innerText='Please login first to buy!';return}let p=prods.find(x=>x.id===id);cart.push(p);localStorage.setItem('zl_cart',JSON.stringify(cart));updateUI();alert(p.name+' added to cart! 🛒');}
function viewCart(){alert('Cart has '+cart.length+' items: '+cart.map(c=>c.name).join(', ')+'\nTotal: ₦'+cart.reduce((a,b)=>a+b.price,0).toLocaleString())}
function openLogin(){document.getElementById('loginModal').classList.add('show')}function closeLogin(){document.getElementById('loginModal').classList.remove('show')}
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('t'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');if(t==='google'){document.getElementById('msg').innerText='Google login coming soon - use Email for now'}}
function showCreate(){document.getElementById('emailForm').style.display='none';document.getElementById('createForm').style.display='block'}function showLogin(){document.getElementById('createForm').style.display='none';document.getElementById('emailForm').style.display='block'}
function doCreate(){let e=document.getElementById('cEmail').value.trim(),p=document.getElementById('cPass').value;if(!e||p.length<6){document.getElementById('msg').innerText='❌ Email and 6+ password needed';return}if(users.find(u=>u.email===e)){document.getElementById('msg').innerText='❌ Account exists, please login';return}users.push({email:e,pass:p});localStorage.setItem('zl_users',JSON.stringify(users));document.getElementById('msg').innerText='✅ Account created! Now login';showLogin()}
function doLogin(){let e=document.getElementById('lEmail').value.trim(),p=document.getElementById('lPass').value;let u=users.find(x=>x.email===e);if(!u){document.getElementById('msg').innerText='❌ No account found, create account first';return}if(u.pass!==p){document.getElementById('msg').innerText='❌ Incorrect password!';return}currentUser=e;localStorage.setItem('zl_current_user',e);document.getElementById('msg').innerText='✅ Login success! Welcome '+e;setTimeout(()=>{closeLogin();updateUI()},1000)}
function logout(){localStorage.removeItem('zl_current_user');currentUser=null;cart=[];localStorage.setItem('zl_cart','[]');updateUI();alert('Logged out')}
render();
</script></body></html>
