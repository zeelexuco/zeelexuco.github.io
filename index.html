<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEELEXU&CO | Luxury Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070707;color:#fff;font-family:Inter,sans-serif}
.header{position:sticky;top:0;background:#070707ee;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #222;z-index:10}
.logo{color:#d4af37;font-weight:800;letter-spacing:2px}.cart-icon{position:relative;background:#111;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px}
#cartCount{background:#d4af37;color:#000;border-radius:50%;padding:2px 6px;font-size:10px;margin-left:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#141414;border:1px solid #222;border-radius:12px;overflow:hidden}
.card img{width:100%;height:170px;object-fit:cover}
.pad{padding:12px}.pad h4{font-size:11px;letter-spacing:1px}.price{color:#d4af37;font-weight:700;margin:6px 0}
.add{width:100%;background:#fff;color:#000;border:0;padding:10px;font-weight:800;font-size:11px;border-radius:6px}
.add.added{background:#d4af37}
#cartPage{display:none;position:fixed;inset:0;background:#070707;z-index:20;padding:20px;overflow:auto}
.cart-item{display:flex;gap:12px;background:#141414;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #222}
.cart-item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.acc-box{background:#111;border:1px solid #333;border-radius:12px;padding:16px;margin:15px 0}
.inp{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:8px;margin:8px 0}
.btn-gold{width:100%;background:#d4af37;color:#000;padding:14px;border:0;border-radius:8px;font-weight:800;margin-top:10px}
.btn-outline{width:100%;background:#000;color:#fff;border:1px solid #333;padding:12px;border-radius:8px;margin-top:8px}
.google{background:#fff;color:#000;display:flex;justify-content:center;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="header">
<div class="logo" style="display:flex;align-items:center;gap:8px">
<img src="logo.png" style="width:32px;height:32px;border-radius:6px;object-fit:cover">
<span>ZEELEXU&CO</span>
</div>
<div class="cart-icon" onclick="openCart()">CART <span id="cartCount">0</span></div>
</div>

<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=400"><div class="pad"><h4>ROLEX PREMIUM</h4><div class="price">₦320,000</div><button class="add" onclick="addCart('ROLEX PREMIUM',320000,this)">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400"><div class="pad"><h4>18K GOLD CHAIN</h4><div class="price">₦125,000</div><button class="add" onclick="addCart('GOLD CHAIN',125000,this)">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400"><div class="pad"><h4>DIAMOND RING</h4><div class="price">₦95,000</div><button class="add" onclick="addCart('DIAMOND RING',95000,this)">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400"><div class="pad"><h4>DESIGNER SHADES</h4><div class="price">₦110,000</div><button class="add" onclick="addCart('SHADES',110000,this)">ADD TO CART</button></div></div>
</div>

<!-- CART & ACCOUNT PAGE -->
<div id="cartPage">
<h2 style="color:#d4af37">YOUR CART</h2>
<div id="cartList" style="margin-top:15px"></div>
<div id="total" style="color:#d4af37;font-weight:800;font-size:18px;margin:15px 0"></div>

<div class="acc-box">
<h4 id="accTitle">CHECKOUT AS GUEST</h4>
<p style="font-size:11px;color:#888;margin:5px 0 10px">or create account to track orders</p>
<input class="inp" id="cName" placeholder="Full Name">
<input class="inp" id="cPhone" placeholder="Phone Number (e.g 0701...)">
<input class="inp" id="cEmail" placeholder="Email (optional)">
<button class="btn-gold" onclick="checkout('guest')">CHECKOUT AS GUEST VIA WHATSAPP</button>
<button class="btn-outline google" onclick="createAcc()">📧 CREATE ACCOUNT WITH EMAIL</button>
<button class="btn-outline google" onclick="alert('Google Sign-In go need small backend later - for now use Email! Your account go save for this phone.')">🔵 CONTINUE WITH GOOGLE</button>
<p style="font-size:10px;color:#555;margin-top:10px;text-align:center">Account saves on this device. Customers fit buy without account.</p>
</div>
<button onclick="closeCart()" style="width:100%;background:transparent;color:#666;border:0;padding:15px">← CONTINUE SHOPPING</button>
</div>

<script>
let cart=JSON.parse(localStorage.getItem('zee_cart')||'[]');
function updateCount(){document.getElementById('cartCount').innerText=cart.length;localStorage.setItem('zee_cart',JSON.stringify(cart))}
function addCart(name,price,btn){cart.push({name,price});updateCount();btn.innerText='ADDED ✓';btn.classList.add('added');setTimeout(()=>{btn.innerText='ADD TO CART';btn.classList.remove('added')},1000)}
function openCart(){if(cart.length==0){alert('Cart empty! Add products first.');return}let list='';let sum=0;cart.forEach((i,idx)=>{sum+=i.price;list+=`<div class=cart-item><img src=https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=100><div><div style=font-size:12px>${i.name}</div><div style=color:#d4af37;font-size:12px>₦${i.price.toLocaleString()}</div><div style=color:#666;font-size:10px;cursor:pointer' onclick='removeItem(${idx})>Remove</div></div></div>`});document.getElementById('cartList').innerHTML=list;document.getElementById('total').innerText='TOTAL: ₦'+sum.toLocaleString();document.getElementById('cartPage').style.display='block'}
function closeCart(){document.getElementById('cartPage').style.display='none'}
function removeItem(i){cart.splice(i,1);updateCount();openCart();if(cart.length==0)closeCart()}
function checkout(type){
let name=document.getElementById('cName').value||'Guest';
let phone=document.getElementById('cPhone').value;
if(!phone){alert('Abeg put phone number');return}
let items=cart.map(c=>`• ${c.name} - ₦${c.price.toLocaleString()}`).join('%0A');
let total=cart.reduce((a,b)=>a+b.price,0);
let msg=`Hello ZEELEXU&CO! New Order%0A%0AName: ${name}%0APhone: ${phone}%0AType: ${type}%0A%0AItems:%0A${items}%0A%0ATOTAL: ₦${total.toLocaleString()}%0A%0ADeliver to Lagos?`;
window.open(`https://wa.me/2347013287677?text=${msg}`,'_blank');
cart=[];updateCount();closeCart();
}
function createAcc(){
let email=document.getElementById('cEmail').value;let name=document.getElementById('cName').value;
if(!email||!name){alert('Put name and email to create account');return}
localStorage.setItem('zee_user',JSON.stringify({name,email}));document.getElementById('accTitle').innerText='ACCOUNT CREATED ✓';alert('Account created! Now you fit checkout — e go remember you next time.');
}
updateCount();
let saved=JSON.parse(localStorage.getItem('zee_user')||'null');if(saved){document.getElementById('cName').value=saved.name;document.getElementById('cEmail').value=saved.email;document.getElementById('accTitle').innerText=`WELCOME BACK, ${saved.name.toUpperCase()}`;}
</script>
</body>
</html>
