<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZL Admin - ZeeleexuCo</title>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{padding:12px 20px;background:gold;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin:5px}
#dashboard{display:none}
.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

<div id="loginBox">
<h2 style="color:gold">ZL CEO LOGIN</h2>
<input id="email" placeholder="Admin Email" value="adewuyioluwagbenga590@gmail.com">
<input id="pass" type="password" placeholder="Password" value="adesoyeajike">
<br>
<button onclick="login()">LOGIN</button>
<p id="msg"></p>
</div>

<div id="dashboard">
<h1 style="color:gold">Welcome Boss! 👑 ZL Dashboard</h1>
<button onclick="logout()" style="background:red;color:white">Logout</button>

<div class="card">
<h3>Add New Product</h3>
<input id="pname" placeholder="Product Name e.g. Luxury Watch">
<input id="pprice" placeholder="Price e.g. 50000">
<input id="pimage" placeholder="Image Link">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="card">
<h3>Your Store Link</h3>
<p>Your customers go here: <br><a href="https://zeeleexuco.github.io" style="color:gold">zeeleexuco.github.io</a></p>
</div>

<div class="card" id="productList">
<h3>Products will show here</h3>
</div>
</div>

<script>
const ADMIN_EMAIL = "adewuyioluwagbenga590@gmail.com";
const ADMIN_PASS = "adesoyeajike";

function login(){
 let e = document.getElementById('email').value;
 let p = document.getElementById('pass').value;
 if(e===ADMIN_EMAIL && p===ADMIN_PASS){
   localStorage.setItem('zl_admin','yes');
   showDash();
 } else {
   document.getElementById('msg').innerHTML = "Wrong! Use:<br>Email: adewuyioluwagbenga590@gmail.com<br>Pass: adesoyeajike";
 }
}

function showDash(){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('dashboard').style.display='block';
}

function logout(){
 localStorage.removeItem('zl_admin');
 location.reload();
}

function addProduct(){
 alert("Product Added! (Connect to Firebase later)\nName: " + document.getElementById('pname').value);
}

// Auto-login if already logged in
if(localStorage.getItem('zl_admin')==='yes'){
 showDash();
}
</script>

</body>
</html>
